description: 'Cockroach Labs is the New York-based software company that builds CockroachDB, a cloud-native, distributed, PostgreSQL-compatible
  SQL database. CockroachDB is offered as Cockroach Labs'' fully managed cloud service (Basic, Standard, and Advanced plans) and as self-hosted
  software. The company provides two primary developer APIs: the CockroachDB Cloud API for managing the lifecycle of cloud-hosted clusters, and
  the CockroachDB Cluster API exposed by every node for cluster health, monitoring, and operational status. CockroachDB is used in production
  by banking, retail, gaming, and media companies including Bose, Hard Rock Digital, DoorDash, and Netflix.'
