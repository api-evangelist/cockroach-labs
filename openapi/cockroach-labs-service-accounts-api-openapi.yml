        source: "curl --request DELETE \\\n  --url https://cockroachlabs.cloud/api/v1/service-accounts/{service_account_id}/credentials/{credential_id} \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN'"
components:
  schemas:
    Any:
      description: "`Any` contains an arbitrary serialized protocol buffer message along with a\nURL that describes the type of the serialized message.\n\nIn its binary encoding, an `Any` is an ordinary message; but in other wire\nforms like JSON, it has a special encoding. The format of the type URL is\ndescribed on the `type_url` field.\n\nProtobuf APIs provide utilities to interact with `Any` values:\n\n- A 'pack' operation accepts a message and constructs a generic `Any` wrapper\n  around it.\n- An 'unpack' operation reads the content of an `Any` message, either into an\n  existing message or a new one. Unpack operations must check the type of the\n  value they unpack against the declared `type_url`.\n- An 'is' operation decides whether an `Any` contains a message of the given\n  type, i.e. whether it can 'unpack' that type.\n\nThe JSON format representation of an `Any` follows one of these cases:\n\n- For types without special-cased JSON encodings, the JSON format\n  representation of the `Any` is the same as that of the message, with an\n  additional `@type` field which contains the type URL.\n- For types with special-cased JSON encodings (typically called 'well-known'\n  types, listed in https://protobuf.dev/programming-guides/json/#any), the\n  JSON format representation has a key `@type` which contains the type URL\n  and a key `value` which contains the JSON-serialized value.\n\nThe text format representation of an `Any` is like a message with one field\nwhose name is the type URL in brackets. For example, an `Any` containing a\n`foo.Bar` message may be written `[type.googleapis.com/foo.Bar] { a: 2 }`."
      type: object
      properties:
        '@type':
          description: 'Identifies the type of the serialized Protobuf message with a URI reference

            consisting of a prefix ending in a slash and the fully-qualified type name.


            Example: type.googleapis.com/google.protobuf.StringValue


            This string must contain at least one `/` character, and the content after

            the last `/` must be the fully-qualified name of the type in canonical

            form, without a leading dot. Do not write a scheme on these URI references

            so that clients do not attempt to contact them.


            The prefix is arbitrary and Protobuf implementations are expected to

            simply strip off everything up to and including the last `/` to identify

            the type. `type.googleapis.com/` is a common default prefix that some

            legacy implementations require. This prefix does not indicate the origin of

            the type, and URIs containing it are not expected to respond to any

            requests.


            All type URL strings must be legal URI references with the additional

            restriction (for the text format) that the content of the reference

            must consist only of alphanumeric characters, percent-encoded escapes, and

            characters in the following set (not including the outer backticks):

            `/-.~_!$&()*+,;=`. Despite our allowing percent encodings, implementations

            should not unescape them to prevent confusion with existing parsers. For

            example, `type.googleapis.com%2FFoo` should be rejected.


            In the original design of `Any`, the possibility of launching a type

            resolution service at these type URLs was considered but Protobuf never

            implemented one and considers contacting these URLs to be problematic and

            a potential security issue. Do not attempt to contact type URLs.'
          type: string
      additionalProperties: {}
    ServiceAccountCredentialAlgorithm.Type:
      description: " - RS256: RS256 (RSASSA-PKCS1-v1_5 using SHA-256).\n - PS256: PS256 (RSASSA-PSS using SHA-256).\n - ES256: ES256 (ECDSA using P-256 and SHA-256).\n - ES384: ES384 (ECDSA using P-384 and SHA-384)."
      type: string
      enum:
      - RS256
      - PS256
      - ES256
      - ES384
    Resource:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ResourceType.Type'
      required:
      - type
    Status:
      type: object
      properties:
        code:
          type: integer
          format: int32
        details:
          type: array
          items:
            $ref: '#/components/schemas/Any'
        message:
          type: string
    UpdateServiceAccountSpecification:
      type: object
      properties:
        description:
          description: description of the service account.
          type: string
        name:
          description: name of the service account.
          type: string
      example:
        description: new description
        name: new name
    ListServiceAccountCredentialsResponse:
      type: object
      properties:
        credentials:
          description: The service account's credentials, ordered by created_at.
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountCredential'
        pagination:
          $ref: '#/components/schemas/KeysetPaginationResponse'
      example:
        credentials:
        - algorithm: RS256
          client_id: crl-sa_abc123
          created_at: '2022-03-22T20:23:11.285067Z'
          credential_type: JWT_BEARER
          expires_at: '2023-03-22T20:23:11.285067Z'
          id: 1234abcd-1234-1234-abcd-12345678abcd
          name: ci signer
          service_account_id: abcd1234-abcd-abcd-1234-abcdef123456
        pagination: {}
      required:
      - credentials
    ServiceAccount:
      description: 'A service account is an identity scoped to an organization that

        represents a non-human user.'
      type: object
      properties:
        created_at:
          description: created_at represents the creation time of the service account.
          type: string
          format: date-time
        creator_name:
          description: creator_name is the name of user that created the service account.
          type: string
        description:
          description: description of the service account.
          type: string
        group_roles:
          description: roles that the service account has inherited via a group.
          type: array
          items:
            $ref: '#/components/schemas/BuiltInFromGroups'
        id:
          description: The ID of the service account.
          type: string
        name:
          description: name of the service account.
          type: string
        roles:
          description: roles that are assigned to the service account.
          type: array
          items:
            $ref: '#/components/schemas/BuiltInRole'
      example:
        created_at: '2022-03-22T20:23:11.285067Z'
        creator_name: creator
        description: ''
        group_roles: []
        id: 12345678-1234-1234-1234-123456789012
        name: SA Name
        roles:
        - name: CLUSTER_ADMIN
          resource:
            type: ORGANIZATION
      required:
      - id
      - name
      - description
      - creator_name
      - created_at
      - roles
      - group_roles
      title: ServiceAccount
    ServiceAccountCredentialType.Type:
      description: ' - JWT_BEARER: JWT_BEARER authenticates with a client-held private key via an OAuth 2.0

        jwt-bearer assertion (RFC 7523).'
      type: string
      enum:
      - JWT_BEARER
    ServiceAccountCredential:
      description: 'ServiceAccountCredential is an OAuth 2.0 jwt-bearer credential a service

        account uses to obtain short-lived access tokens. CockroachDB Cloud stores

        only the public key and signature algorithm; it never holds a secret on the

        customer''s behalf.'
      type: object
      properties:
        algorithm:
          $ref: '#/components/schemas/ServiceAccountCredentialAlgorithm.Type'
        client_id:
          description: 'The public OAuth client identifier; also the iss and sub a signed assertion

            must carry.'
          type: string
          example: crl-sa_abc123
        created_at:
          description: When the credential was created.
          type: string
          format: date-time
          example: '2022-03-22T20:23:11.285067Z'
        credential_type:
          $ref: '#/components/schemas/ServiceAccountCredentialType.Type'
        description:
          description: An optional longer description.
          type: string
        disabled_at:
          description: When the credential was disabled; unset if active.
          type: string
          format: date-time
        expires_at:
          description: 'When the credential expires. Always set; a credential cannot be created

            without an expiry.'
          type: string
          format: date-time
          example: '2023-03-22T20:23:11.285067Z'
        id:
          description: The unique ID of the credential.
          type: string
          format: uuid
          example: 1234abcd-1234-1234-abcd-12345678abcd
        name:
          description: A human-readable name for the credential.
          type: string
          example: ci signer
        service_account_id:
          description: The ID of the service account the credential belongs to.
          type: string
          format: uuid
          example: abcd1234-abcd-abcd-1234-abcdef123456
      example:
        algorithm: RS256
        client_id: crl-sa_abc123
        created_at: '2022-03-22T20:23:11.285067Z'
        credential_type: JWT_BEARER
        expires_at: '2023-03-22T20:23:11.285067Z'
        id: 1234abcd-1234-1234-abcd-12345678abcd
        name: ci signer
        service_account_id: abcd1234-abcd-abcd-1234-abcdef123456
      required:
      - id
      - service_account_id
      - name
      - credential_type
      - client_id
      - algorithm
      - created_at
      - expires_at
      title: ServiceAccountCredential
    ListServiceAccountsResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/KeysetPaginationResponse'
        service_accounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
      required:
      - service_accounts
    CreateServiceAccountCredentialBody:
      type: object
      properties:
        algorithm:
          $ref: '#/components/schemas/ServiceAccountCredentialAlgorithm.Type'
        description:
          description: An optional longer description.
          type: string
        expires_at:
          description: 'Required. When the credential expires; must be in the future. There is no

            maximum lifetime.'
          type: string
          format: date-time
          example: '2023-03-22T20:23:11.285067Z'
        name:
          description: A human-readable name for the credential.
          type: string
          example: ci signer
        public_key:
          description: The PEM-encoded public key used to verify signed JWT assertions.
          type: string
          example: '-----BEGIN PUBLIC KEY-----

            MIIBIjANBgkq...

            -----END PUBLIC KEY-----

            '
      example:
        algorithm: RS256
        expires_at: '2023-03-22T20:23:11.285067Z'
        name: ci signer
        public_key: '-----BEGIN PUBLIC KEY-----

          MIIBIjANBgkq...

          -----END PUBLIC KEY-----

          '
        service_account_id: abcd1234-abcd-abcd-1234-abcdef123456
      required:
      - name
      - public_key
      - algorithm
      - expires_at
    OrganizationUserRole.Type:
      description: " - FOLDER_ADMIN: Preview: A folder admin role.\n - FOLDER_MOVER: Preview: A folder mover role.\n - AUDITOR: Limited Access: An auditor role with org-wide, read-only visibility into configuration, identity, authorization, audit logs, and cluster metadata.\n - CLUSTER_DATA_ACCESSOR: Limited Access: A cluster data accessor role with SQL and data access to clusters (databases, SQL shell, DB Console) without cluster-management privileges."
      type: string
      enum:
      - BILLING_COORDINATOR
      - ORG_ADMIN
      - ORG_MEMBER
      - CLUSTER_ADMIN
      - CLUSTER_OPERATOR_WRITER
      - CLUSTER_DEVELOPER
      - CLUSTER_CREATOR
      - FOLDER_ADMIN
      - FOLDER_MOVER
      - METRICS_VIEWER
      - CLUSTER_MONITOR
      - BILLING_VIEWER
      - AUDITOR
      - CLUSTER_DATA_ACCESSOR
    KeysetPaginationResponse:
      type: object
      properties:
        next_page:
          type: string
        previous_page:
          type: string
    BuiltInFromGroups:
      type: object
      properties:
        group_names:
          type: array
          items:
            type: string
        role:
          $ref: '#/components/schemas/BuiltInRole'
    BuiltInRole:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/OrganizationUserRole.Type'
        resource:
          $ref: '#/components/schemas/Resource'
      required:
      - name
      - resource
    ResourceType.Type:
      description: " - ORGANIZATION: An organization.\n - CLUSTER: A cluster resource.\n - FOLDER: Preview: A folder resource."
      type: string
      enum:
      - ORGANIZATION
      - CLUSTER
      - FOLDER
    CreateServiceAccountRequest:
      type: object
      properties:
        description:
          description: description of the service account.
          type: string
        name:
          description: name of the service account.
          type: string
        roles:
          description: roles that are assigned to the service account.
          type: array
          items:
            $ref: '#/components/schemas/BuiltInRole'
      example:
        description: ''
        name: new name
        roles:
        - name: CLUSTER_ADMIN
          resource:
            type: ORGANIZATION
      required:
      - name
      - description
      - roles
    Error:
      type: object
      description: Standard error response returned by the API.
      properties:
        code:
          type: integer
          description: HTTP status code of the error.
        message:
          type: string
          description: Human-readable description of the error.
        details:
          type: array
          description: Additional detail objects providing error context.
          items:
            type: object
    PaginationResponse:
      type: object
      description: Pagination metadata included in list responses.
      properties:
        next:
          type: string
          description: Token or cursor for retrieving the next page of results.
        last:
          type: string
          description: Token or cursor for the last page of results.
        time:
          type: string
          format: date-time
          description: Server time at which the paginated query was executed.
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication. Generate a token in the CockroachDB Cloud Console under Organization Settings > API Access.
  parameters:
    paginationPage:
      name: pagination.page
      in: query
      description: Page number for paginated results, starting from 1.
      schema:
        type: string
    resourceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the resource.
      schema:
        type: string
    paginationAsOfTime:
      name: pagination.as_of_time
      in: query
      description: RFC3339 timestamp to return results as they were at a specific point in time (time-travel query).
      schema:
        type: string
        format: date-time
    paginationLimit:
      name: pagination.limit
      in: query
      description: Maximum number of results to return per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
    paginationSortOrder:
      name: pagination.sort_order
      in: query
      description: Sort direction for paginated results. Accepted values are ASC and DESC.
      schema:
        type: string
        enum:
        - ASC
        - DESC
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
