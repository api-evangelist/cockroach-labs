      x-badges:
      - color: red
        label: LIMITED ACCESS
      x-codeSamples:
      - lang: Shell + Curl
        source: "curl --request POST \\\n  --url https://cockroachlabs.cloud/api/v1/service-accounts/{service_account_id}/credentials \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN' \\\n  --json '{\"algorithm\":\"RS256\",\"expires_at\":\"2023-03-22T20:23:11.285067Z\",\"name\":\"ci signer\",\"public_key\":\"-----BEGIN PUBLIC KEY-----\\nMIIBIjANBgkq...\\n-----END PUBLIC KEY-----\\n\",\"service_account_id\":\"abcd1234-abcd-abcd-1234-abcdef123456\"}'"
  /api/v1/service-accounts/{service_account_id}/credentials/{credential_id}:
